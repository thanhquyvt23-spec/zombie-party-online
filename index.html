<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Party Online</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10161a;color:#edf5f5;font:15px system-ui;overflow:hidden}
#top{position:absolute;z-index:2;top:8px;left:8px;right:8px;display:flex;gap:8px;justify-content:space-between;align-items:center;pointer-events:none;flex-wrap:wrap}
.pill{background:#101b20dd;border:1px solid #40515a;border-radius:10px;padding:7px 10px;font-weight:700}
#lobby{position:absolute;z-index:5;inset:0;background:#0c1418ed;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{width:min(480px,100%);background:#1b282e;border:1px solid #40515a;border-radius:18px;padding:24px;box-shadow:0 15px 50px #0008}
h1{color:#a9f36d;margin:0 0 8px}p{line-height:1.5;color:#c2d0d5}input{width:100%;padding:12px;margin:7px 0;background:#0e171b;color:white;border:1px solid #52636b;border-radius:9px;font-size:16px}
button{border:0;border-radius:9px;background:#a9f36d;color:#142012;font-weight:900;padding:12px 15px;font-size:15px;cursor:pointer}
.row{display:flex;gap:8px}.row>*{flex:1}#status{font-size:13px;color:#c3d0d5;margin-top:10px}
canvas{width:100vw;height:100vh;display:block;touch-action:none}
#mobile{position:absolute;inset:auto 0 12px;display:none;justify-content:space-between;padding:0 16px;z-index:3;pointer-events:none}
.pad{width:132px;height:132px;position:relative;pointer-events:auto}.key{position:absolute;width:43px;height:43px;border-radius:12px;background:#d7e5e544;border:1px solid #ffffff66;color:white;display:grid;place-items:center;font-size:22px;user-select:none;touch-action:none}
#up{top:0;left:44px}#down{bottom:0;left:44px}#left{top:44px;left:0}#right{top:44px;right:0}
#fire{pointer-events:auto;width:90px;height:90px;border-radius:50%;align-self:end;background:#e85d4dce;color:white;border:2px solid #ffffff66;touch-action:none}
@media(pointer:coarse){#mobile{display:flex}}
</style></head><body>
<div id="top"><span class="pill">☣ ZOMBIE PARTY ONLINE</span><span class="pill" id="info">Chưa vào phòng</span><span class="pill" id="hp">♥ 100</span></div>
<canvas id="c"></canvas>
<div id="lobby"><div class="panel"><h1>Zombie Party Online</h1><p>Sinh tồn cùng bạn bè trong phòng 2–5 người. Tạo phòng rồi gửi link mời bạn bè. PC: WASD + chuột. Mobile: nút di chuyển + bắn.</p>
<input id="nick" maxlength="14" placeholder="Tên người chơi" value="Survivor">
<div class="row"><button id="create">Tạo phòng</button><input id="room" maxlength="8" placeholder="Mã phòng" style="text-transform:uppercase"></div>
<button id="join" style="width:100%;margin-top:8px">Tham gia phòng</button><button id="copy" style="width:100%;margin-top:8px;background:#42545d;color:white">Sao chép link mời</button><div id="status">Đang chờ kết nối máy chủ…</div></div></div>
<div id="mobile"><div class="pad"><div class="key" id="up">▲</div><div class="key" id="down">▼</div><div class="key" id="left">◀</div><div class="key" id="right">▶</div></div><button id="fire">BẮN</button></div>
<script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight;
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
let ws,playerId=null,roomId='',players={},zombies=[],bullets=[],loot=[],keys={},mouse={x:W/2,y:H/2,down:false},mobile={x:0,y:0,fire:false},lastSend=0,gameStarted=false;
const status=document.querySelector('#status'),info=document.querySelector('#info'),hpEl=document.querySelector('#hp'),lobby=document.querySelector('#lobby');
function connect(){let proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}`);ws.onopen=()=>status.textContent='Đã kết nối máy chủ. Tạo hoặc tham gia phòng.';ws.onclose=()=>status.textContent='Mất kết nối máy chủ. Hãy tải lại trang.';ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='joined'){playerId=m.id;roomId=m.room;gameStarted=true;lobby.style.display='none';info.textContent=`Phòng ${roomId} · ${m.count}/5 người`;history.replaceState({},'',`?room=${roomId}`)}if(m.type==='state'){players=m.players;zombies=m.zombies;bullets=m.bullets;loot=m.loot;let me=players[playerId];if(me)hpEl.textContent=`♥ ${Math.max(0,Math.round(me.hp))}`}if(m.type==='notice')status.textContent=m.text;if(m.type==='roomfull')status.textContent='Phòng đã đủ 5 người.';};}
connect();
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function enter(create){let name=document.querySelector('#nick').value.trim()||'Survivor',id=document.querySelector('#room').value.trim().toUpperCase();send({type:create?'create':'join',name,room:id});}
document.querySelector('#create').onclick=()=>enter(true);document.querySelector('#join').onclick=()=>enter(false);
document.querySelector('#copy').onclick=async()=>{let u=location.href.split('?')[0]+(roomId?'?room='+roomId:document.querySelector('#room').value?'?room='+document.querySelector('#room').value.toUpperCase():'');try{await navigator.clipboard.writeText(u);status.textContent='Đã sao chép link phòng!'}catch{prompt('Sao chép link này:',u)}};
const params=new URLSearchParams(location.search);if(params.get('room'))document.querySelector('#room').value=params.get('room').toUpperCase();
function point(e){let r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top}
canvas.addEventListener('pointermove',point);canvas.addEventListener('pointerdown',e=>{point(e);mouse.down=true});addEventListener('pointerup',()=>mouse.down=false);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['w','a','s','d',' '].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
[['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]].forEach(([id,x,y])=>{let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();mobile.x=x;mobile.y=y;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>{mobile.x=0;mobile.y=0}))});
let fire=document.querySelector('#fire');fire.addEventListener('pointerdown',e=>{e.preventDefault();mobile.fire=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>fire.addEventListener(ev,()=>mobile.fire=false));
function tick(){let me=players[playerId];if(gameStarted&&me){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+mobile.x,y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+mobile.y;let aim=Math.atan2(mouse.y-H/2,mouse.x-W/2);if(Date.now()-lastSend>45){send({type:'input',x,y,aim,fire:mouse.down||mobile.fire});lastSend=Date.now()}}
 draw();requestAnimationFrame(tick)}
function draw(){ctx.fillStyle='#182328';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#26363b';for(let x=0;x<W;x+=42){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 // world centered on local player for compact viewport
 let me=players[playerId],cx=me?me.x:0,cy=me?me.y:0,ox=W/2-cx,oy=H/2-cy;
 loot.forEach(l=>{ctx.fillStyle=l.kind==='med'?'#56ed8c':'#f3cb4e';ctx.fillRect(l.x+ox-9,l.y+oy-9,18,18);ctx.fillStyle='#132019';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText(l.kind==='med'?'+':'A',l.x+ox,l.y+oy+4)});
 bullets.forEach(b=>{ctx.fillStyle='#ffe78a';ctx.beginPath();ctx.arc(b.x+ox,b.y+oy,4,0,7);ctx.fill()});
 zombies.forEach(z=>{ctx.fillStyle='#628b54';ctx.beginPath();ctx.arc(z.x+ox,z.y+oy,z.r,0,7);ctx.fill();ctx.fillStyle='#253329';ctx.fillRect(z.x+ox-5,z.y+oy-3,3,3);ctx.fillRect(z.x+ox+3,z.y+oy-3,3,3)});
 Object.values(players).forEach(p=>{ctx.fillStyle=p.id===playerId?'#67b9f7':'#f1b75b';ctx.beginPath();ctx.arc(p.x+ox,p.y+oy,15,0,7);ctx.fill();ctx.strokeStyle='#e9f5f8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x+ox,p.y+oy);ctx.lineTo(p.x+ox+Math.cos(p.aim)*24,p.y+oy+Math.sin(p.aim)*24);ctx.stroke();ctx.fillStyle='white';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(p.name,p.x+ox,p.y+oy-22)});
}
tick();
</script></body></html>
